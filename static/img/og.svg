<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b160f"></stop>
      <stop offset="100%" stop-color="#5a2e1f"></stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"></rect>

  <!-- Soft decorative circles -->
  <circle cx="1000" cy="140" r="120" fill="#c89b6d" opacity="0.12"></circle>
  <circle cx="950" cy="520" r="180" fill="#c89b6d" opacity="0.08"></circle>

  <!-- Stylized W (logo mark) -->
  <text x="180" y="340" fill="#ff7a1a" font-size="180" font-family="Brush Script MT, cursive" transform="rotate(-8 180 340)">
    W
  </text>

  <!-- Brand name -->
  <text x="650" y="280" fill="#f5e6d3" font-size="78" font-family="Georgia, serif" text-anchor="middle" letter-spacing="2">
    Wanilla Coffee
  </text>

  <!-- Subtitle -->
  <text x="650" y="350" fill="#e6c7a1" font-size="34" font-family="Arial, sans-serif" text-anchor="middle">
    Speciality Coffee • Bakery • Breakfast
  </text>

  <!-- Location / time -->
  <text x="650" y="410" fill="#e6c7a1" font-size="28" font-family="Arial, sans-serif" text-anchor="middle">
    Tashkent • 24/7
  </text>

</svg>